{%extends "student_layout.html"%}
{%block content%}
<div class="center"><h3>Take Quiz</h3></div>
<div class="center"> Quiz ID: {{ quiz.q_id }}, Subject: {{ quiz.chapter.subject.sname }}, Chapter: {{ quiz.chapter.cname }} </div>
<form action="/take_quiz/{{q_id}}/{{name}}" method="POST">
    {% for question in quiz.questions %}
        <div class="card">
            <div class="card-body">
                <h5>Q{{ loop.index }}: {{ question.question_statement }}</h5>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.ques_id }}" id="q{{ question.ques_id }}_1" value="option1">
                    <label class="form-check-label" for="q{{ question.ques_id }}_1">
                        {{ question.option1 }}
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.ques_id }}" id="q{{ question.ques_id }}_2" value="option2">
                    <label class="form-check-label" for="q{{ question.ques_id }}_2">
                        {{ question.option2 }}
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.ques_id }}" id="q{{ question.ques_id }}_3" value="option3">
                    <label class="form-check-label" for="q{{ question.ques_id }}_3">
                        {{ question.option3 }}
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="question_{{ question.ques_id }}" id="q{{ question.ques_id }}_4" value="option4">
                    <label class="form-check-label" for="q{{ question.ques_id }}_4">
                        {{ question.option4 }}
                    </label>
                </div>
            </div>
        </div>
        {% endfor %}
        <div class="text-center">
            <button type="submit" class="btn btn-success">Submit Quiz</button>
            <a href="{{ url_for('student_dashboard', name=name) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{%endblock%}
