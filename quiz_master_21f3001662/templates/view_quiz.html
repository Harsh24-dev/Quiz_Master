{% extends "admin_layout.html" %}
{% block content %}
<div class="center"><h3>View Quiz</h3></div>
{% for question in quiz.questions %}
<div class = "card">
    <div class="card-body">
        <h5>Q{{loop.index}}: {{ question.question_statement }}</h5>
        <div class="form-check">
            <label class="form-check-label" for="q{{ question.ques_id }}_1">
                A) {{ question.option1 }}
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label" for="q{{ question.ques_id }}_1">
                B) {{ question.option2 }}
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label" for="q{{ question.ques_id }}_1">
                C) {{ question.option3 }}
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label" for="q{{ question.ques_id }}_1">
                D) {{ question.option4 }}
            </label>
        </div>
        <div class="form-check">
            <p><strong>Correct Answer:</strong> {{ question.correct_option }}</p>
        </div>    
        <div class="form-check">
            <a href="{{url_for('edit_question', ques_id = question.ques_id, name = name )}}" class = "btn btn-outline-primary">Edit</a>
            <a href="/delete_question/{{ question.q_id }}/{{ question.ques_id }}/{{ name }}" class="btn btn-outline-danger">Delete</a>
        </div>
    </div>
</div>
{% endfor %}
<div class="center">
    <a href="/add_question/{{q_id}}/{{name}}" class="btn btn-outline-primary">Add More Questions</a>
    <a href="/quiz/{{ name }}" class="btn btn-outline-secondary">Cancel</a>
</div>
{% endblock %}
