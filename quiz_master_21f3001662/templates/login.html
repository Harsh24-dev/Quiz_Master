<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="\static\styles\main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Login</title>
</head>
<body>
    <div class="my_container">
        <div class="center"><h1>Quiz Master</h1></div>
        <div class="my_panel">
            <div class="center"><h3>Login</h3></div>
            <form action="/login" method="POST">
            <div class="input_form">
                <div class="mb-3">
                    <label for="name" class="form-label">Username(Email)</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="iitm@study.ac.in">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="password">
                </div>
                <div class="mb-3"><button type="submit" class="btn btn-primary">Login</button></div>
                <div>New user?<a href="/register">Signup as Student</a></div>
                <div class="err_msg">{{msg}}</div>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
