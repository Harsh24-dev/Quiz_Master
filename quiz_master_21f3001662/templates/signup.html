<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="\static\styles\main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Signup</title>
</head>
<body>
    <div class="my_container">
        <div class="center"><h1>Quiz Master</h1></div>
        <div class="my_panel">
            <div class="center"><h3>New Student Registration</h3></div>
            <form action="/register" method="POST">
            <div class="input_form">
                <div class="mb-3">
                    <label for="name" class="form-label">Username</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="iitm@study">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="password">
                </div>
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="IIT Madras">
                </div>
                <div class="mb-3">
                    <label for="qualification" class="form-label"> Qualification</label>
                    <select name="qualification" id="qualification"  class="form-select">
                        <option value="Marticulation">Marticulation</option>
                        <option value="Higher Secondary">Higher Secondary</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Post Graduate">Post Graduate</option>
                        <option value="Phd">Phd</option>
                    </select>
                </div>
                <div class=mb-3><button type="submit" class="btn btn-primary">Register</button></div>
                <div>Existing user?<a href="/login">Login</a></div>
            </div>
            </form>
        </div>
    </div>
</body>
</html>
